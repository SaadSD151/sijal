# Publishes the ready-built game (dist/site) to GitHub Pages on every push to main
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      # GitHub sometimes needs a moment before the uploaded site is visible to the deploy step
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
