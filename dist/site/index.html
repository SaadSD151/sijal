<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="سِجال حرب المدن: لعبة حرب استراتيجية مجانية على المتصفح، وسّع أرضك واحتلّ المدن والعب أونلاين مع أصحابك.">
<meta name="theme-color" content="#092440">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>سِجال حرب المدن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<style>
:root{
  /* layout: a full-bleed painted war table; brass-and-ink instrument panels float at the edges and keep the centre of the map clear */
  --ink:#08131e;--panel:rgba(10,22,35,.86);--line:rgba(227,185,90,.3);--line2:rgba(255,255,255,.11);
  --gold:#e3b95a;--gold2:#f6dc9a;--parch:#f1e6cc;--dim:#9db0c2;--sea:#092440;--good:#6fdc98;--bad:#ff7a68;--warn:#f2b441;
  --disp:'Aref Ruqaa','Amiri','Times New Roman',serif;--ui:'IBM Plex Sans Arabic','Tajawal','Segoe UI',system-ui,sans-serif;
  --g:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--parch);font-family:var(--ui);font-size:14px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(4,10,18,.5) 100%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
b{font-weight:700}small{color:var(--dim);font-size:.82em}h2,h3,h4,p{margin:0}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

/* ── in-game HUD ── */
#hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
#hud,.screen{touch-action:manipulation}
#bar,#atk{touch-action:pan-x}
#hud>*{position:absolute;pointer-events:auto}
#top{top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 12px;white-space:nowrap}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.06);border:1px solid var(--line2);flex:none}
.ib img{width:20px;height:20px}
.stat{display:flex;align-items:center;gap:7px}
.stat img{width:22px;height:22px;opacity:.92}
.stat>div{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 5px;min-width:96px}
.stat b{font-size:16px}
.mt{flex-basis:100%;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;display:block}
.mt u{display:block;height:100%;background:linear-gradient(90deg,#c9972f,var(--gold2));width:0;transition:width .25s}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#e3b95a 55%,#9a6a1c);box-shadow:0 0 0 1.5px #7a5210 inset;flex:none}
#sG>div{min-width:66px}
.era{display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:4px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12.5px}
.era b{font-size:11.5px;color:var(--dim)}
.era.rdy{border-color:#ffe9a8;background:linear-gradient(#f4d584,#c9972f);color:#1c1405;animation:pulse 1.4s infinite}
.era.rdy b{color:#3a2a08}
#sS{display:flex;align-items:center;gap:8px}
#sS>div{display:flex;flex-direction:column;line-height:1.25}
.sz{width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p,0)*1turn),rgba(255,255,255,.16) 0);-webkit-mask:radial-gradient(circle,transparent 40%,#000 44%);mask:radial-gradient(circle,transparent 40%,#000 44%);flex:none}
.s0{--c:#7edc8c}.s1{--c:#f6cf55}.s2{--c:#e58f41}.s3{--c:#c6e6ff}
#spd{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
#spd button{padding:6px 9px;font-size:12.5px;font-weight:600}
#spd button.on{background:var(--gold);color:#1c1405}
#bLb{display:none}

#lb{top:74px;inset-inline-end:var(--g);width:236px;max-height:44%;overflow:auto;padding:8px}
#lb h4{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:4px}
#lbr{display:flex;flex-direction:column}
.lr{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:6px;width:100%;text-align:start;font-size:12.5px}
.lr:hover{background:rgba(255,255,255,.07)}
.lr i{width:10px;height:10px;border-radius:3px;flex:none}
.lr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .s{width:14px;text-align:center;color:var(--gold2)}
.lr .p{color:var(--dim)}
.lr.me{background:rgba(227,185,90,.17)}.lr.me .n{font-weight:700}
.lr.al .s{color:var(--good)}.lr.wr .s{color:var(--bad)}
.lr.dead{opacity:.35;text-decoration:line-through}

#mini{bottom:12px;inset-inline-end:var(--g);width:220px;height:auto;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.45);cursor:pointer}
#bHome{bottom:164px;inset-inline-end:var(--g);border-radius:9px}

#bottom{bottom:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100% - 580px)}
#ratio{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:12.5px;width:min(440px,100%)}
#ratio input{flex:1;min-width:0;accent-color:var(--gold);height:22px;margin:0}
#ratio b{min-width:96px;text-align:end;color:var(--gold2)}
#bar{display:flex;gap:6px;padding:7px;max-width:100%;overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.bb{position:relative;flex:0 0 66px;height:66px;border-radius:10px;background:linear-gradient(#19324a,#0e2132);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s}
.bb:active{transform:scale(.94)}
.bb img{width:24px;height:24px}
.bb .nm{font-size:10.5px;line-height:1.2;max-width:62px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bb .ct{font-size:11.5px;color:var(--gold2);font-weight:600}
.bb kbd{position:absolute;top:2px;inset-inline-start:5px;font:600 9.5px var(--ui);color:var(--dim)}
.bb.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(227,185,90,.6)}
.bb.lock{opacity:.42}.bb.lock img{filter:grayscale(1)}
.bb.poor .ct{color:var(--bad)}

#feed{bottom:14px;inset-inline-start:var(--g);width:264px;display:flex;flex-direction:column;gap:4px;pointer-events:none!important}
.fd{align-self:flex-start;background:rgba(8,16,26,.8);padding:4px 9px;border-radius:7px;font-size:12.5px;animation:fdin .25s;max-width:100%}
.fd .q{color:var(--parch)}
#atk{top:74px;inset-inline-start:var(--g);display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.ac{display:flex;align-items:center;gap:7px;padding-block:4px;padding-inline:10px 5px;border-radius:999px;font-size:12.5px;flex:none}
.ac i{width:10px;height:10px;border-radius:50%;flex:none}
.ac .n{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac b{color:var(--gold2)}
.ac.anx{background:linear-gradient(#f4d584,#c9972f);color:#1c1405;border-color:#ffe9a8;font-weight:700;padding-inline:10px 12px;animation:pulse 1.4s infinite}
.ac.anx .n{max-width:200px}
.ac button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.1);font-size:11px}

#card{top:42%;inset-inline-start:var(--g);transform:translateY(-50%);width:272px;padding:12px;display:flex;flex-direction:column;gap:10px;z-index:4}
.ch{display:flex;align-items:center;gap:9px}
.ch i{width:14px;height:34px;border-radius:4px;flex:none}
.ch>div{flex:1;min-width:0;display:flex;flex-direction:column}
.ch b{font-size:15px}
.cs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cs>div{background:rgba(255,255,255,.05);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column}
.m0{color:var(--bad)}.m1{color:#f0a37a}.m3{color:#b9e3a0}.m4{color:var(--good)}
#cS{font-size:12.5px;font-weight:600}
.cb{display:flex;flex-direction:column;gap:6px}

#toasts{top:130px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92%;z-index:5}
.ts{padding:8px 14px;border-radius:10px;font-weight:600;animation:fdin .2s;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.ts.bad{border-color:var(--bad);color:#ffd0c8}.ts.prop{border-color:var(--gold)}
#banner{top:20%;left:0;right:0;text-align:center;font-family:var(--disp);font-weight:700;font-size:clamp(28px,5.4vw,60px);line-height:1.5;color:var(--gold2);text-shadow:0 2px 0 #000,0 0 26px rgba(0,0,0,.9);pointer-events:none!important;opacity:0;padding:0 16px;text-wrap:balance}
#banner.show{animation:ban 3.2s ease forwards}
#banner.bad{color:#ffb0a4}#banner.sea{color:#e8f4ff}
#hint{top:74px;left:50%;transform:translateX(-50%);max-width:min(560px,90%);width:max-content;background:var(--parch);color:#2a2112;padding:8px 16px;border-radius:9px;font-weight:600;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4);pointer-events:none!important}
#tip{padding:6px 10px;font-size:12.5px;pointer-events:none!important;border-radius:8px;white-space:nowrap;z-index:6}

/* ── screens ── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;background:radial-gradient(ellipse at 50% 28%,rgba(8,19,30,.42),rgba(5,11,19,.9));z-index:8}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
#pause{background:rgba(5,11,19,.78)}
.logo{text-align:center}
.l1{font-family:var(--disp);font-weight:700;font-size:clamp(84px,19vw,168px);line-height:1.2;padding:0 .2em .16em;background:linear-gradient(180deg,#fff6d0,#e3b95a 52%,#9a6a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.45))}
.l2{font-family:var(--disp);font-size:clamp(22px,4.4vw,36px);color:var(--parch);margin-top:-14px}
.l3{color:var(--dim);margin-top:6px}
.btn{padding:11px 22px;border-radius:11px;background:linear-gradient(#1b3650,#11263a);border:1px solid var(--line);font-weight:600;font-size:15px;min-width:230px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.97)}
.btn.big{background:linear-gradient(#f4d584,#c9972f);color:#1c1405;border-color:#ffe9a8;font-size:18px;font-weight:700;box-shadow:0 6px 22px rgba(227,185,90,.3)}
.btn.sm{min-width:0;padding:7px 12px;font-size:13px}
.mb{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.mf{display:flex;flex-direction:column;align-items:center;gap:10px}
.rk{color:var(--dim)}.rk b{color:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line2);background:rgba(10,22,35,.7);font-size:13px}
.chip.on{background:var(--gold);color:#1c1405;border-color:var(--gold);font-weight:700}
.screen h2{font-family:var(--disp);font-size:clamp(26px,5vw,38px);line-height:1.4;color:var(--gold2);font-weight:700;text-wrap:balance;text-align:center}
h3{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:6px}
.facs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(780px,100%)}
.fac{display:flex;flex-direction:column;gap:3px;text-align:start;padding:10px 12px;border-radius:11px;background:var(--panel);border:1px solid var(--line2)}
.fac b{font-size:15px}
.fac b::before{content:'';display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--fc);margin-inline-end:7px}
.fac span{font-size:12.5px}
.fac em{font-style:normal;font-size:12px;color:var(--dim)}
.fac.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:rgba(60,48,18,.86)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;width:min(780px,100%)}
.opts .chips{justify-content:flex-start}
.fld{display:block}
.fld textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--parch);font:inherit;resize:vertical;-webkit-user-select:text;user-select:text}
.fld input{width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--parch);font:inherit;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .btn{min-width:150px}
.hl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(920px,100%)}
.hl>div{background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:10px 12px}
.hl b{color:var(--gold2)}
.hl p{font-size:13px;margin-top:3px}
.keys{color:var(--dim);font-size:12.5px;max-width:70ch;text-align:center}
.endbox{width:min(620px,100%);padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px}
.endbox h1{margin:0;font-family:var(--disp);font-size:clamp(34px,7vw,58px);line-height:1.4;color:var(--gold2)}
.endbox.lost h1{color:#ffb0a4}
.endbox h3{margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stats>div{background:rgba(255,255,255,.05);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column}
.stats b{font-size:16px}
#rep{width:100%;height:auto;border-radius:9px;border:1px solid var(--line2)}
.rbar{height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.rbar u{display:block;height:100%;background:var(--gold);width:0}
.best{color:var(--gold2)}
#load{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,11,19,.84);font-family:var(--disp);font-size:30px;color:var(--gold2);z-index:9}

@keyframes fdin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ban{0%{opacity:0;transform:scale(.92)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,185,90,.25)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

/* menu corners, civilization picker, update log */
#app:not(.mob) .mb .acc,#app:not(.mob) .mb .news{position:absolute;top:22px;min-width:220px;padding:16px 30px;font-size:21px;font-weight:700;border-color:var(--gold);box-shadow:0 6px 22px rgba(0,0,0,.45)}
#app:not(.mob) .mb .acc{right:max(16px,env(safe-area-inset-right,0px))}
#app:not(.mob) .mb .news{left:max(16px,env(safe-area-inset-left,0px))}
#fpick{top:122px;left:50%;transform:translateX(-50%);width:min(600px,92%);padding:10px 12px;text-align:center;display:flex;flex-direction:column;gap:7px;z-index:3}
#fpick h4{font-size:13px;color:var(--gold2)}
#fpick .chip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.mob #fpick{top:98px}
.btn.ok{background:linear-gradient(#7fe0a0,#2f9a58);border-color:#c9ffd9;color:#06200f}
.btn.go{background:linear-gradient(#e2685a,#a8322a);border-color:#ffb0a4;color:#fff}
.nl{display:flex;flex-direction:column;gap:10px;width:min(640px,100%)}
.nl>div{background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:10px 14px}
.nl b{color:var(--gold2);margin-inline-end:8px}
.nl ul{margin:6px 0 0;padding-inline-start:20px}
/* attack type picker */
#amode{bottom:150px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px}
.amh{font-size:12.5px;font-weight:600;color:var(--gold2);padding:4px 8px}
#amode .chip{padding:5px 11px}
.mob #amode{bottom:196px;left:auto;transform:none;inset-inline-end:var(--g);flex-direction:column;align-items:stretch;border-radius:12px;gap:4px}
@media (min-width:700px){.mob #amode{bottom:140px}}
/* rank ladder */
.rks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;width:min(760px,100%)}
.rks>div{display:flex;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 11px}
.rks span{color:var(--dim);font-variant-numeric:tabular-nums}
.rks .done{opacity:.6}
.rks .cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.rks .cur b{color:var(--gold2)}
/* online lobby */
.code{font:700 clamp(40px,10vw,72px)/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;color:var(--gold2);-webkit-user-select:text;user-select:text}
.pls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;width:min(780px,100%)}
.pl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.pl i{width:12px;height:28px;border-radius:4px;flex:none}
.pl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.made{color:var(--dim);font-size:12.5px;text-align:center}
/* world-shape picker and opponents slider */
.wts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wt{font-size:14px}
.opts>div:has(.wts){grid-column:1/-1}
.mob .wts{grid-template-columns:repeat(2,minmax(0,1fr))}
.wt{display:flex;flex-direction:column;gap:3px;padding:4px;border-radius:9px;border:1px solid var(--line2);background:rgba(10,22,35,.7);font-size:12px;text-align:center}
.wt img{width:100%;height:auto;border-radius:6px;display:block}
.wt.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;color:var(--gold2);font-weight:700}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;min-width:0;accent-color:var(--gold);height:28px;margin:0}
.rng b{min-width:28px;text-align:center;font-size:18px;color:var(--gold2)}

/* ── mobile version: bars dock to the edges, thumbs reach everything ── */
.mob #cv{cursor:default}
.mob #top{top:0;left:0;right:0;transform:none;border-radius:0 0 14px 14px;border-width:0 0 1px;flex-wrap:wrap;gap:6px 8px;justify-content:space-between;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mob #top::before{content:'';order:2;flex-basis:100%;height:0}
.mob #bLb{display:grid;order:1}
.mob #bEra,.mob #sS,.mob #spd{order:3}
.mob .stat>div{min-width:84px}.mob #sG>div{min-width:54px}
.mob .era{flex:1;min-width:0;padding:4px 8px}
.mob #spd button{padding:7px 8px}
.mob #lb{display:none;top:100px;left:var(--g);right:var(--g);width:auto;max-height:46%;z-index:3}
.mob #lb.open{display:block}
.mob .lr{padding:7px 8px;font-size:13.5px}
.mob #mini{display:none}
.mob #bHome{bottom:140px;inset-inline-end:var(--g)}

const PAL=[[231,76,60],[52,152,219],[46,204,113],[241,196,15],[155,89,182],[230,126,34],[26,188,156],[236,112,160],[127,140,255],[149,165,60],[211,84,0],[94,214,214],[190,144,212],[255,165,120],[100,180,100],[170,120,80],[220,220,110],[90,120,200],[200,90,130],[60,160,140],[240,150,200],[140,200,240],[180,60,60],[120,120,160]];
const DX8=[1,-1,0,0,1,1,-1,-1],DY8=[0,0,1,-1,1,-1,1,-1];

const hyp=(a,b)=>Math.sqrt(a*a+b*b),bump=(d,s)=>{const v=1/(1+d*d/s);return v*v;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){n=Math.floor(n);if(n>=1e6)return(n/1e6).toFixed(n>=1e7?1:2)+'M';if(n>=1e4)return(n/1e3).toFixed(n>=1e5?0:1)+'K';return''+n;}

class Heap{
  constructor(){this.p=[];this.v=[];}
  get size(){return this.p.length;}
  peek(){return this.p[0];}
  push(pr,val){const p=this.p,v=this.v;let i=p.length;p.push(pr);v.push(val);while(i>0){const j=(i-1)>>1;if(p[j]<=pr)break;p[i]=p[j];v[i]=v[j];i=j;}p[i]=pr;v[i]=val;}
  pop(){const p=this.p,v=this.v,top=v[0],lp=p.pop(),lv=v.pop(),n=p.length;
    if(n>0){let i=0;for(;;){let c=2*i+1;if(c>=n)break;if(c+1<n&&p[c+1]<p[c])c++;if(p[c]>=lp)break;p[i]=p[c];v[i]=v[c];i=c;}p[i]=lp;v[i]=lv;}
    return top;}
}

// gradient-noise fbm, seeded
function makeNoise(seed){
  const r=mulberry32(seed),p=new Uint8Array(256),perm=new Uint8Array(512);
  for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=(r()*(i+1))|0,t=p[i];p[i]=p[j];p[j]=t;}for(let i=0;i<512;i++)perm[i]=p[i&255];
  const GX=[1,-1,1,-1,1,-1,0,0],GY=[1,1,-1,-1,0,0,1,-1];
  function n2(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255;
    const h0=perm[X+perm[Y]]&7,h1=perm[X+1+perm[Y]]&7,h2=perm[X+perm[Y+1]]&7,h3=perm[X+1+perm[Y+1]]&7;
    const a=GX[h0]*xf+GY[h0]*yf,b=GX[h1]*(xf-1)+GY[h1]*yf,c=GX[h2]*xf+GY[h2]*(yf-1),d=GX[h3]*(xf-1)+GY[h3]*(yf-1);
    const u=xf*xf*xf*(xf*(xf*6-15)+10),v=yf*yf*yf*(yf*(yf*6-15)+10);
    return a+(b-a)*u+(c+(d-c)*u-(a+(b-a)*u))*v;}
  return function(x,y,oct){let s=0,amp=1,f=1,tot=0;for(let o=0;o<oct;o++){s+=n2(x*f,y*f)*amp;tot+=amp;amp*=.5;f*=2.03;}return s/tot;};
}

// names — nations (name, leader) and city name parts, in ar / en
const NAT={
 ar:[['مملكة الرمال','الملك نمر'],['سلطنة البحر','السلطان بدر'],['إمارة النخيل','الأمير راكان'],['اتحاد الجبل','القائد صخر'],['إمبراطورية الشمس','الإمبراطورة شمس'],['مملكة القمر','الملكة ليان'],['خانية السهوب','الخان باتور'],['دولة الصقر','الأمير غيث'],['قبائل الثلج','الزعيم برّاق'],['ممالك الذهب','الملكة جود'],['دوقية الغابة','الدوق أوس'],['إمارة اللؤلؤ','الأميرة لولوة'],['اتحاد الحديد','القائد ليث'],['سلطنة المرجان','السلطانة مرجانة'],['مملكة العاصفة','الملك رعد'],['دولة النهر','الحاكم فرات'],['إمبراطورية الفجر','الإمبراطور ضياء'],['قلاع الشمال','الأمير شهاب'],['إمارة الواحة','الشيخ فهد'],['مملكة الياقوت','الملكة ياقوت'],['حلف الذئاب','القائد ذيب'],['سلطنة النجوم','السلطان نجم'],['دولة البركان','الحاكم لهب'],['مملكة السحاب','الملكة غيمة'],['إمارة الزيتون','الأمير زيد'],['سلطنة الرياح','السلطان هبوب'],['مملكة العنبر','الملكة عنبر'],['حلف النسور','القائد عقاب'],['دولة الكثبان','الشيخ رمّال'],['إمبراطورية الأفق','الإمبراطور مدى']],
 en:[['Kingdom of Sands','King Nimr'],['Sea Sultanate','Sultan Badr'],['Emirate of Palms','Emir Rakan'],['Mountain League','Chief Sakhr'],['Sun Empire','Empress Shams'],['Moon Kingdom','Queen Layan'],['Steppe Khanate','Khan Batur'],['Falcon State','Prince Ghaith'],['Frost Tribes','Chief Barraq'],['Golden Realms','Queen Joud'],['Forest Duchy','Duke Aws'],['Pearl Emirate','Princess Lulwa'],['Iron Union','Marshal Laith'],['Coral Sultanate','Sultana Marjana'],['Storm Kingdom','King Raad'],['River State','Governor Furat'],['Dawn Empire','Emperor Diya'],['Northern Keeps','Prince Shihab'],['Oasis Emirate','Sheikh Fahd'],['Ruby Kingdom','Queen Yaqut'],['Wolf Pact','Warlord Dheeb'],['Star Sultanate','Sultan Najm'],['Volcano State','Governor Lahab'],['Cloud Kingdom','Queen Ghaima'],['Olive Emirate','Emir Zaid'],['Wind Sultanate','Sultan Haboob'],['Amber Kingdom','Queen Anbar'],['Eagle Pact','Marshal Uqab'],['Dune State','Sheikh Rammal'],['Horizon Empire','Emperor Mada']]};
const CITY={
 ar:[['تل','واحة','قلعة','مرسى','برج','عين','رأس','وادي','حصن','دار','باب','جسر','بئر','روضة','ثغر','قصر'],['الريح','النور','الصخر','اللؤلؤ','الغيم','الذهب','الموج','الظل','النسر','الأمان','النجم','الفجر','الرمل','الزيتون','الياقوت','السحاب','الأسد','الندى']],
 en:[['Tel','Waha','Qalat','Marsa','Burj','Ain','Ras','Wadi','Hisn','Dar','Bab','Jisr','Bir','Rawda','Thaghr','Qasr'],['Rih','Noor','Sakhr','Lulu','Ghaym','Dhahab','Mawj','Dhill','Nasr','Aman','Najm','Fajr','Raml','Zaytun','Yaqut','Sahab','Asad','Nada']]};
// tribe names: 6 x 10 x 10 = 600 combinations
const TRIBE={
 ar:[['قبيلة','بنو','آل','عشيرة','فرسان','أهل'],['الصقر','الذئب','الأسد','النمر','الفهد','النسر','الحصان','الجمل','الغزال','الثعلب'],['الأحمر','الأسود','الأبيض','الذهبي','الرمادي','الشمالي','الجنوبي','الشرقي','الغربي','العالي']],
 en:[['Tribe','Clan','House','Band','Riders','Folk'],['Falcon','Wolf','Lion','Tiger','Cheetah','Eagle','Horse','Camel','Gazelle','Fox'],['Red','Black','White','Golden','Grey','Northern','Southern','Eastern','Western','High']]};
const tribeName=(i,lang)=>{const T=TRIBE[lang]||TRIBE.ar,a=T[0][(i/100)|0],b=T[1][((i/10)|0)%10],c=T[2][i%10];return lang==='en'?a+' of the '+c+' '+b:a+' '+b+' '+c;};
const cityName=(idx,lang)=>{const c=CITY[lang]||CITY.ar;return c[0][(idx/18)|0]+' '+c[1][idx%18];};

// ── SIJAL · procedural world generation (pure data, no DOM) ──
function genMap(o){
  const W=o.w,H=o.h,N=W*H,rng=mulberry32(o.seed),fbm=makeNoise(o.seed*7+13),fb2=makeNoise(o.seed*31+7);
  const elev=new Float32Array(N),ter=new Uint8Array(N),val=new Float32Array(N),moist=new Float32Array(N),T=o.type||'continents',asp=W/H;
  const F={continents:2.4,pangaea:2.2,islands:4,inner:2.7,twin:2.5,shores:3.4,crescent:2.6,straits:2.5,lakes:3.6}[T]||2.5;
  for(let y=0,i=0;y<H;y++)for(let x=0;x<W;x++,i++){
    const u=x/H,v=y/H,nx=x/W,ny=y/H,wx=fb2(u*1.7+5.2,v*1.7+1.3,3)*.4,wy=fb2(u*1.7+9.1,v*1.7+7.7,3)*.4;
    let e=fbm((u+wx)*F,(v+wy)*F,6);
    const cx=(nx-.5)*2,cy=(ny-.5)*2,rc=hyp(cx,cy)/1.2,ed=Math.min(Math.min(nx,1-nx)*asp,Math.min(ny,1-ny));
    if(T==='pangaea')e=e*.75+(.55-rc)*.8;else if(T==='inner')e=e*.7+(rc-.45)*.75;else if(T==='twin')e=e*.8-bump(nx-.5,.008)*.8;
    else if(T==='shores')e=e*.95+(.5-rc)*.35;else if(T==='crescent')e=e*.6+(.26-Math.abs(hyp(cx+.35,cy*.9)-.78))*1.3;
    else if(T==='straits')e=e*.8-bump(ny-.34,.0032)*.8-bump(ny-.67,.0032)*.8;else if(T==='lakes')e=e*.9+(.6-rc)*.3;
    elev[i]=e-(1-smooth(0,.09,ed))*1.5;moist[i]=fb2(u*3+40,v*3+17,4);
  }
  const ratio={continents:.47,pangaea:.52,islands:.34,inner:.46,twin:.46,shores:.46,crescent:.4,straits:.5,lakes:.7}[T]||.45;
  const srt=Float32Array.from(elev).sort(),L0=Math.floor(N*(1-ratio)),sea=srt[L0],LN=N-L0;
  const hHill=srt[L0+Math.floor(LN*.74)]-sea,hMnt=srt[L0+Math.floor(LN*.9)]-sea,hmax=srt[N-1]-sea;
  for(let i=0;i<N;i++)elev[i]-=sea;
  // remove specks & ponds, mark open water
  const land=new Uint8Array(N),lab=new Uint8Array(N),q=new Int32Array(N),big=new Uint8Array(N);
  for(let i=0;i<N;i++)land[i]=elev[i]>=0?1:0;
  for(let s=0;s<N;s++){if(lab[s])continue;const k=land[s];let qh=0,qt=0;q[qt++]=s;lab[s]=1;
    while(qh<qt){const c=q[qh++],x=c%W;
      if(x>0&&!lab[c-1]&&land[c-1]===k){lab[c-1]=1;q[qt++]=c-1;}if(x<W-1&&!lab[c+1]&&land[c+1]===k){lab[c+1]=1;q[qt++]=c+1;}
      if(c>=W&&!lab[c-W]&&land[c-W]===k){lab[c-W]=1;q[qt++]=c-W;}if(c<N-W&&!lab[c+W]&&land[c+W]===k){lab[c+W]=1;q[qt++]=c+W;}}
    if(k&&qt<10)for(let j=0;j<qt;j++){land[q[j]]=0;elev[q[j]]=-.012;big[q[j]]=1;}
    else if(!k&&qt<40)for(let j=0;j<qt;j++){land[q[j]]=1;elev[q[j]]=.004;}
    else if(!k)for(let j=0;j<qt;j++)big[q[j]]=1;}
  let landN=0;
  for(let y=0,i=0;y<H;y++)for(let x=0;x<W;x++,i++){
    const e=elev[i];if(!land[i]){ter[i]=e>-.05?1:0;continue;}landN++;
    const u=x/H,v=y/H,temp=(y/H)*.9+.05+fb2(u*2+80,v*2+33,3)*.35-(e/hmax)*.2,m=moist[i];
    ter[i]=e>=hMnt?6:e>=hHill?5:temp<.26?7:(temp>.6&&m<.03)?4:m>.07?3:2;
  }
  // distance from land tiles to water
  const cd=new Uint8Array(N).fill(255);let qh=0,qt=0;
  for(let i=0;i<N;i++)if(!land[i]){cd[i]=0;q[qt++]=i;}
  while(qh<qt){const c=q[qh++],d=cd[c]+1,x=c%W;if(d>250)continue;
    if(x>0&&cd[c-1]>d){cd[c-1]=d;q[qt++]=c-1;}if(x<W-1&&cd[c+1]>d){cd[c+1]=d;q[qt++]=c+1;}if(c>=W&&cd[c-W]>d){cd[c-W]=d;q[qt++]=c-W;}if(c<N-W&&cd[c+W]>d){cd[c+W]=d;q[qt++]=c+W;}}
  const wd=new Uint8Array(N).fill(255);qh=0;qt=0;
  for(let i=0;i<N;i++)if(land[i]){wd[i]=0;q[qt++]=i;}
  while(qh<qt){const c=q[qh++],d=wd[c]+1,x=c%W;if(d>6)continue;
    if(x>0&&wd[c-1]>d){wd[c-1]=d;q[qt++]=c-1;}if(x<W-1&&wd[c+1]>d){wd[c+1]=d;q[qt++]=c+1;}if(c>=W&&wd[c-W]>d){wd[c-W]=d;q[qt++]=c-W;}if(c<N-W&&wd[c+W]>d){wd[c+W]=d;q[qt++]=c+W;}}
  // rivers: steepest descent from the highlands to the sea
  const riv=new Uint8Array(N),rivers=[],want=Math.round(landN/2000)+2;
  for(let t=0;t<want*10&&rivers.length<want;t++){
    let i=-1;for(let k=0;k<50;k++){const j=(rng()*N)|0;if(land[j]&&elev[j]>hHill*.85&&!riv[j]){i=j;break;}}if(i<0)continue;
    const path=[i],seen=new Set([i]);let ok=false;
    for(let s=0;s<500;s++){let best=-1,be=1e9;const x=i%W,y=(i/W)|0;
      for(let d=0;d<8;d++){const X=x+DX8[d],Y=y+DY8[d];if(X<0||Y<0||X>=W||Y>=H)continue;const n=Y*W+X;if(seen.has(n))continue;const e=elev[n]+rng()*.004;if(e<be){be=e;best=n;}}
      if(best<0||be>elev[i]+.02)break;i=best;path.push(i);seen.add(i);if(!land[i]||riv[i]){ok=true;break;}}
    if(ok&&path.length>=10){rivers.push(path);for(const p of path)riv[p]=1;}
  }
  for(let i=0;i<N;i++)if(riv[i]&&land[i]){const x=i%W;for(const n of[i,x>0?i-1:i,x<W-1?i+1:i,i>=W?i-W:i,i<N-W?i+W:i]){if(!land[n])continue;if(ter[n]===4)ter[n]=2;if(riv[n]<2)riv[n]=riv[n]||2;}}
  for(let i=0;i<N;i++)if(land[i])val[i]=T_VAL[ter[i]]+(riv[i]?.35:0);
  // neutral cities
  const cities=[],used=new Set(),nc=clamp(Math.round(landN/1100),6,90);
  for(let t=0;t<nc*120&&cities.length<nc;t++){
    const x=4+(rng()*(W-8))|0,y=4+(rng()*(H-8))|0,i=y*W+x,tt=ter[i];if(tt<2||tt===6)continue;
    if(rng()>(cd[i]<=2?.5:0)+(riv[i]?.4:0)+T_VAL[tt]*.5+.12)continue;
    if(cities.some(c=>(c.x-x)**2+(c.y-y)**2<169))continue;
    let nm;do{nm=(rng()*288)|0;}while(used.has(nm));used.add(nm);

// ── naval landings ──

function launchBoat(g,a,ti,ratio){

function tickBoats(g){

// ── trade ships: each port sends a ship to a foreign port and back; the round trip pays gold ──
function portPath(g,a,b,open){
  const W=g.W,H=g.H,ter=g.M.ter,wd=g.M.wd,prev=g.prev,q=g.q,goal=[];prev.fill(-1);let qh=0,qt=0;
  // with `open`, ships must stay 4+ tiles off any shore except while leaving or entering harbour
  const ok=(j,x,y)=>ter[j]<2&&(!open||wd[j]>=4||(x-a.x)**2+(y-a.y)**2<=64||(x-b.x)**2+(y-b.y)**2<=64);
  for(let d=0;d<8;d++){const x=b.x+DX8[d],y=b.y+DY8[d];if(x>=0&&y>=0&&x<W&&y<H&&ter[y*W+x]<2)goal.push(y*W+x);}

  while(qh<qt){const c=q[qh++];
    if(goal.indexOf(c)>=0){const p=[c];let k=c;while(prev[k]!==k){k=prev[k];p.push(k);}return p.reverse();}
    const cx=c%W,cy=(c/W)|0;

  return null;
}
function launchTrade(g,s){

  if(!c.length)return;const d=c[(g.rng()*c.length)|0],rt=s.rt||(s.rt={});let path=rt[d.i];

}
function tickTrades(g){

      else if(b.dir<0&&b.p<=0){const amt=Math.round((60+b.path.length*2.2)*(1+.25*(A.era-1))*(FAC[A.fac].port||1));A.gold+=amt;emit(g,'trade',{a:b.a,amt,x:b.from.x,y:b.from.y});rm=true;}}
    if(rm){g.trades[j]=g.trades[g.trades.length-1];g.trades.pop();}}
}
// nearest enemy shore reachable by sea from our own coast (used when the tapped spot has no usable beach)
function seaLanding(g,a,o){
  const W=g.W,H=g.H,N=g.N,ter=g.M.ter,own=g.owner,prev=g.prev,q=g.q,now=g.tick;prev.fill(-1);let qh=0,qt=0;
  for(let i=0;i<N;i++)if(ter[i]<2&&adjOwn(g,i,a)){prev[i]=i;q[qt++]=i;}
  while(qh<qt){const c=q[qh++],cx=c%W,cy=(c/W)|0;
    for(let d=0;d<4;d++){const x=cx+DX8[d],y=cy+DY8[d];if(x<0||y<0||x>=W||y>=H)continue;const j=y*W+x;if(ter[j]>1&&own[j]===o&&g.fall[j]<=now)return j;}
    for(let d=0;d<8;d++){const x=cx+DX8[d],y=cy+DY8[d];if(x<0||y<0||x>=W||y>=H)continue;const j=y*W+x;if(ter[j]<2&&prev[j]<0){prev[j]=c;q[qt++]=j;}}}

// a port may be placed a little inland: it snaps to the nearest free shore tile
function snapPort(g,n,i,R,ty){ty=ty||'port';
  if(!canBuild(g,n,ty,i))return i;const W=g.W,x0=i%W,y0=(i/W)|0;let b=i,bd=1e9;
  for(let y=Math.max(0,y0-R);y<=Math.min(g.H-1,y0+R);y++)for(let x=Math.max(0,x0-R);x<=Math.min(W-1,x0+R);x++){const d=(x-x0)**2+(y-y0)**2;if(d<bd&&d<=R*R&&!canBuild(g,n,ty,y*W+x)){bd=d;b=y*W+x;}}

// ── missiles, blasts, ultimates ──
function mslCost(n,type){return Math.round(MSL[type].cost*(FAC[n.fac].msl||1));}

  if(ti==null||ti<0||g.M.ter[ti]<2)return'no';const o=g.owner[ti];if(o&&A.ally[o])return'ally';
  const tx=ti%g.W,ty=(ti/g.W)|0;let silo=null,bd=1e9;

function blast(g,cx,cy,R,by,o){

    if(by&&by!==ow){O.lastHit[by]=now;O.att[by]=Math.max(-100,O.att[by]-50);if(O.ally[by])breakAlly(g,by,ow);}}

function useUlt(g,n,ti){

// ── diplomacy ──

}
function breakAlly(g,a,b){
  const A=g.nations[a],B=g.nations[b];if(!A.ally[b])return;A.ally[b]=B.ally[a]=0;A.truce[b]=B.truce[a]=g.tick+150;

}
// alliances last two minutes; 20 seconds before the end each side says whether it wants to carry on
function aiRenew(g,A,B){return A.att[B.id]>0&&g.hegemon!==B.id&&g.rng()<.85?1:0;}
function allyPass(g){

}

function gift(g,a,b,amt){

}
function callArms(g,a,target){

// ── economy, seasons, world ──
function economy(g){
  const now=g.tick;for(const n of g.nations){if(!n||!n.alive)continue;const f=FAC[n.fac];
    n.mSpd=(f.spd||1)*(now<n.blitz?.5:1);n.mAtk=(1+.08*(n.era-1))*(now<n.blitz?1.25:1);n.mDef=(f.def||1)*(now<n.wall?2.5:1)*(now<n.collapse?.55:1);
    const x=clamp(n.troops/n.maxT,.04,2);let gr=x<1?n.maxT*.0048*x*(1-x):-(n.troops-n.maxT)*.02;
    if(gr>0)gr*=(f.grow||1)*g.sGrow*(n.human?1:g.diff.grow)*(n.minor?.45:1)*(1-clamp((n.tiles/g.M.land-.2)*1.6,0,.6));
    n.troops+=gr;n.gold+=n.income/TPS;}
}
function structPass(g){

  for(const s of g.structs)if(!s.dead&&s.type==='port')ports++;

    if(s.type==='city'){n._pop+=4000*s.level*(s.capital?1.5:1);n._inc+=1+s.level;
      if(s.level<5&&g.tick-n.lastHitAny>150&&++s.grow>=40+35*s.level){s.grow=0;s.level++;emit(g,'cityUp',{a:n.id,s});}}
    else if(s.type==='port'){n._inc+=2*(FAC[n.fac].port||1);if(g.tick>=(s.tcd||0)){s.tcd=g.tick+250+((g.rng()*120)|0);launchTrade(g,s);}}}

    n.maxT=6000+n.val*120*(1+.12*(n.era-1))+n._pop;if(n.minor)n.maxT*=.5;
    n.income=(3+n.val*.003+n._inc)*(f.gold||1)*g.sGold*(1+.1*(n.era-1))*(n.human?1:g.diff.gold);

}
function seasonTick(g){const s=Math.floor(g.tick/SEASON_LEN)%4;if(s!==g.season){g.season=s;const S=SEAS[s];g.sSpd=S.spd;g.sCost=S.cost;g.sGrow=S.grow;g.sGold=S.gold;emit(g,'season',{s});}}
// centroids, bounding boxes, border lengths between every pair (index 0 = neutral)

  for(const n of ns)if(n){n.x0=W;n.y0=H;n.x1=0;n.y1=0;n.coast=0;}
  for(let y=0,i=0;y<H;y++)for(let x=0;x<W;x++,i++){
    if(ter[i]<2)continue;const o=own[i];
    if(o){const n=ns[o];sx[o]+=x;sy[o]+=y;ct[o]++;if(x<n.x0)n.x0=x;if(x>n.x1)n.x1=x;if(y<n.y0)n.y0=y;if(y>n.y1)n.y1=y;if(cd[i]===1)n.coast++;}
    if(x<W-1&&ter[i+1]>1){const p=own[i+1];if(p!==o){nb[o*K+p]++;nb[p*K+o]++;}}
    if(y<H-1&&ter[i+W]>1){const p=own[i+W];if(p!==o){nb[o*K+p]++;nb[p*K+o]++;}}

}
// encirclement: small landlocked enemy pockets and tiny neutral gaps fall to whoever surrounds them
function pocketPass(g){

    while(qh<qt){const c=q[qh++],x=c%W;if(g.fall[c]>now)bad=true;if(g.structAt[c])hasS=true;
      for(let d=0;d<4;d++){let j;if(d===0){if(x===0)continue;j=c-1;}else if(d===1){if(x===W-1)continue;j=c+1;}else if(d===2){if(c<W)continue;j=c-W;}else{if(c>=N-W)continue;j=c+W;}
        if(ter[j]<2){water=true;continue;}const p=own[j];
        if(p===o){if(!lab[j]){lab[j]=1;q[qt++]=j;}}else if(nbo===-1)nbo=p;else if(nbo!==p)nbo=-2;}}
    if(bad||nbo<=0||qt>300||(hasS&&qt>25))continue;const K=g.nations[nbo];if(!K.alive)continue;

}
function worldEvent(g){

  const al=g.nations.filter(n=>n&&n.alive);if(al.length<2)return;
  if(r<.34){for(let t=0;t<60;t++){const i=(g.rng()*g.N)|0;if(g.M.ter[i]>1&&!g.structAt[i]){g.pending.push({type:'meteor',x:i%W,y:(i/W)|0,at:now+50});emit(g,'meteorWarn',{x:i%W,y:(i/W)|0});break;}}}
  else if(r<.62){const top=al.reduce((a,b)=>b.tiles>a.tiles?b:a);if(top.tiles<500)return;
    for(let t=0;t<90;t++){const x=top.x0+((g.rng()*(top.x1-top.x0+1))|0),y=top.y0+((g.rng()*(top.y1-top.y0+1))|0);if(g.owner[y*W+x]!==top.id)continue;
      let near=false;for(const s of g.structs)if(!s.dead&&s.type==='city'&&s.owner===top.id&&(s.x-x)**2+(s.y-y)**2<81){near=true;break;}if(near)continue;

        const d=hyp(X-x,Y-y),i=Y*W+X;if(d<=R&&g.owner[i]===top.id&&!g.structAt[i]&&g.rng()<1.15-d/R*.5){setOwner(g,i,0);c++;}}

  else{for(const n of al)n.gold+=70*n.cnt.city*n.era;emit(g,'caravan',{});}
}
function checkOver(g){
  let alive=0,last=null,top=null;for(const n of g.nations)if(n&&n.alive){alive++;last=n;if(!top||n.tiles>top.tiles)top=n;}

  for(const n of g.nations)if(n&&n.alive&&n.mon){h=n.id;if(g.tick>=n.mon.cd){w=n;why='mon';}}
  g.hegemon=h;const c=h&&(share>.4||g.nations[h].mon)?h:0;if(c&&g.coalition!==c)emit(g,'coalition',{d:c});g.coalition=c;

  const hu=g.nations[g.human];
  if(w)g.over={win:w.id===g.human,w:w.id,why};else if(hu&&!hu.alive&&!g.o.mp)g.over={win:false,w:0,why:'dead'};

function snapshot(g){
  const W=g.W,dv=g.N>250000?4:g.N>120000?3:2,w=(W/dv)|0,h=(g.H/dv)|0,s=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++)s[y*w+x]=g.owner[y*dv*W+x*dv];

function tick(g){

  seasonTick(g);economy(g);tickAttacks(g);tickBoats(g);tickTrades(g);tickMissiles(g);tickPending(g);
  if(now%10===0){
    structPass(g);allyPass(g);const fl=g.fallList;for(let j=fl.length-1;j>=0;j--)if(g.fall[fl[j]]<=now){g.dirty.push(fl[j]);fl[j]=fl[fl.length-1];fl.pop();}

// ── SIJAL · AI leaders: expansion, war, building, diplomacy ──

function commonEnemy(g,a,b){const now=g.tick;for(const e of g.nations)if(e&&e.alive&&e!==a&&e!==b&&now-a.lastHit[e.id]<600&&(now-b.lastHit[e.id]<600||now-b.lastAtk[e.id]<600))return true;return false;}

function aiBuild(g,n,threat){
  const K=g.nations.length;let hostile=threat,type=null,enemySilo=false;
  if(!hostile){let w=-30;for(const m of g.nations)if(m&&m.alive&&m.id!==n.id&&!n.ally[m.id]&&g.nb[n.id*K+m.id]>2&&n.att[m.id]<w){w=n.att[m.id];hostile=m.id;}}
  for(const m of g.nations)if(m&&m.alive&&m.id!==n.id&&!n.ally[m.id]&&m.cnt.silo)enemySilo=true;

function aiSite(g,n,type,hostile){
  const W=g.W,H=g.H,rng=g.rng,own=g.owner,w=n.x1-n.x0+1,h=n.y1-n.y0+1;let best=-1,bs=-1e9;
  if(w<=0||h<=0||!n.cap)return -1;

    const x=n.x0+((rng()*w)|0),y=n.y0+((rng()*h)|0),i=y*W+x;if(own[i]!==n.id||canBuild(g,n,type,i))continue;

    for(let d=0;d<8;d++){const X=x+DX8[d]*4,Y=y+DY8[d]*4;if(X<0||Y<0||X>=W||Y>=H)continue;const o=own[Y*W+X];if(o===n.id)inner++;else if(o&&!n.ally[o]&&(!hostile||o===hostile))enemy++;}

    else if(type==='port')s+=inner-cityD*.2+Math.min(sameD,30)*.2;
    else s+=inner*2-hyp(n.cap.x-x,n.cap.y-y)*.25;

  }

function aiDip(g,n){
  const P=PERS[n.pers],now=g.tick,K=g.nations.length,id=n.id,rng=g.rng,ai=n.ai;let allies=0,foes=0;
  for(const m of g.nations){
    if(!m||!m.alive||m.id===id)continue;let a=n.att[m.id];
    if(n.ally[m.id]){allies++;a=Math.min(70,a+2);}
    else if(g.nb[id*K+m.id]>2){foes++;a-=1+3*P.agg;}
    else a+=a<0?1:-.3;
    if(g.hegemon===m.id)a-=6;
    n.att[m.id]=clamp(a,-100,100);
  }
  for(const m of g.nations){
    if(!m||!m.alive||!n.ally[m.id])continue;const age=now-n.allyAt[m.id];let br=false;
    if(g.coalition===m.id||m.mon)br=true;
    else if(age>900&&foes===0&&g.nb[id*K]===0&&rng()<.15+.4*P.tre)br=true;
    else if(age>1200&&g.nb[id*K+m.id]>2&&m.troops<n.troops*.6&&rng()<.02+.06*P.tre)br=true;
    else if(!m.human&&age>2400&&rng()<.2)br=true;
    if(br){breakAlly(g,id,m.id);if(m.human)say(g,n,'betray',m.id);return;}
  }
  if(allies<(P.trust>.6?2:1)&&rng()<.35&&now-ai.propAt>300){
    let best=null,bs=18;
    for(const m of g.nations){
      if(!m||!m.alive||m.id===id||n.ally[m.id]||g.hegemon===m.id||m.mon||now-n.lastHit[m.id]<600)continue;
      if(m.minor)continue;
      if(m.human&&(now<(g.propCd||0)||!(g.nb[id*K+m.id]>0||(n.cap&&m.cap&&hyp(n.cap.x-m.cap.x,n.cap.y-m.cap.y)<45))))continue;
      const s=n.att[m.id]+P.trust*20+(commonEnemy(g,n,m)?20:0);if(s>bs){bs=s;best=m;}
    }
    if(best){ai.propAt=best.human?now+1500:now;if(best.human)g.propCd=now+900;propose(g,id,best.id);}

}
function aiNaval(g,n){

const NET={on:false,host:false,started:false,conns:[],players:[],q:[],code:'',peer:null,up:null,sums:{},last:0,acc:0,goAt:0,warned:false};
const BCMODE=/[?&]bc=1/.test(location.search);
// every player action goes through here: applied at once offline, or sent to the host online
function send(c){const g=G;if(!g)return;if(!NET.on)return applyCmd(g.human,c);if(NET.host)NET.q.push([g.human,c]);else if(NET.up)NET.up.send({t:'c',c});}
function applyCmd(pid,c){
  const g=G,n=g.nations[pid],mine=pid===g.human,W=g.W;if(!n||!c)return;let r=0;
  if(c.k==='spawn'){
    if(g.started||n.spawned||!(c.i>=0&&c.i<g.N)||!canSpawn(g,c.i)){if(mine)err('spawn');return;}
    if(FAC[c.fac])n.fac=c.fac;if(!g.o.mp){n.color=FAC[n.fac].c;natPix(n);R.full=true;}
    spawn(g,n,c.i);
    if(mine){const tx=c.i%W,ty=(c.i/W)|0;sfx('city');lookAt(tx,ty,Math.max(fitZoom(g)*2.4,UI.mob?5:6));for(let k=0;k<3;k++)addFx('ring',tx,ty,{r:6+k*3,dur:900+k*500,col:'#ffe9a8'});if(g.o.mp){UI.phase='wait';buildHud();hint(t('mpWait'),true);}}
    if(!g.o.mp){startGame(g);UI.phase='play';buildHud();UI.hintT=performance.now();hint(null);}
    return;
  }
  if(c.k==='go'){
    if(g.started)return;for(const m of g.nations)if(m&&m.human&&!m.spawned){const i=pickSpawn(g,12);if(i>=0)spawn(g,m,i);else m.alive=false;}
    startGame(g);UI.phase='play';UI.hintT=performance.now();hint(null);const me=g.nations[g.human];if(me&&me.cap)lookAt(me.cap.x,me.cap.y,Math.max(fitZoom(g)*2.4,UI.mob?5:6));return;
  }
  if(c.k==='drop'){if(n.human){n.human=false;feed(t('mpLeft',nmh(n)),'warn');}return;}
  if(!g.started||!n.alive)return;
  const D=c.d!=null?g.nations[c.d]:null;if(c.d!=null&&(!D||!D.alive||c.d===pid))return;
  switch(c.k){
    case'atk':{const i=c.i;if(!(i>=0&&i<g.N)||g.M.ter[i]<2)return;const tx=i%W,ty=(i/W)|0,o=g.owner[i],ratio=clamp(+c.r||.4,.05,1);if(o===pid)return;
      if(o&&canAnnex(g,pid,o)){const T=g.nations[o],nm=nmh(T),pn=natName(T);annex(g,pid,o);if(mine){feed(t('m_annex',nm),'good');sfx('city');banner(t('m_annex',pn));}return;}
      const before=n.troops;let boat=false;r=c.m==='all'?launchAttack(g,pid,o,ratio,-1,-1):launchAttack(g,pid,o,ratio,tx,ty,true);
      if(r==='noborder'){const cc=g.M.coastD[i]===1&&portOk(g,i)?i:nearCoast(g,i,8);r=cc>=0?launchBoat(g,pid,cc,ratio):'nopath';if(r==='nopath'){const sl=seaLanding(g,pid,o);if(sl>=0)r=launchBoat(g,pid,sl,ratio);}boat=typeof r==='object';}
      if(!mine)return;if(typeof r==='object')sfx(boat?'boat':'attack');if(r==='clash'){feed(t('m_clash'),'good');sfx('attack');}
      if(typeof r==='object'||r==='clash')addFx('text',tx,ty,{s:fmt(before-n.troops),dur:1100,col:'#ffe9a8'});else err(r);return;}
    case'sea':{if(!D)return;const ratio=clamp(+c.r||.4,.05,1);let cc=c.i>=0&&c.i<g.N&&g.owner[c.i]===c.d?(g.M.coastD[c.i]===1&&portOk(g,c.i)?c.i:nearCoast(g,c.i,8)):-1;
      r=cc>=0?launchBoat(g,pid,cc,ratio):'nopath';if(r==='nopath'){cc=seaLanding(g,pid,c.d);if(cc>=0)r=launchBoat(g,pid,cc,ratio);}
      if(mine){if(typeof r==='object'){sfx('boat');addFx('text',cc%W,(cc/W)|0,{s:fmt(r.troops),dur:1100,col:'#ffe9a8'});}else err(r);}return;}
    case'build':if(!ST[c.s])return;r=build(g,n,c.s,c.s==='port'||c.s==='coast'?snapPort(g,n,c.i,clamp(c.R|0,0,8),c.s):c.i);if(mine){if(r)err(r);else sfx('build');}return;
    case'msl':if(!MSL[c.s])return;r=launchMissile(g,pid,c.s,c.i);if(mine&&r)err(r);return;
    case'ult':r=useUlt(g,n,c.i);if(mine&&r)err(r);return;
    case'era':if(n.era<4&&!eraUp(g,n)&&mine)err('gold');return;
    case'ally':if(D)propose(g,pid,c.d);return;
    case'break':if(D)breakAlly(g,pid,c.d);return;
    case'gift':if(!D)return;r=gift(g,pid,c.d,+c.amt||0);if(mine){if(!r)err('gold');UI.cardGift=Math.max(50,Math.round(n.gold*.25/10)*10);UI.cardKey='';}return;
    case'renew':if(D&&n.ally[c.d])n.allyRen[c.d]=c.y?1:0;return;
    case'arms':if(D){const ok=callArms(g,pid,c.d);if(mine)feed(t(ok?'m_arms':'m_noAllies'));}return;
    case'cancel':{const q=g.attacks.find(q=>q.id===c.id&&q.a===pid);if(q)q.cancel=true;return;}
    case'acc':case'rej':{const j=g.proposals.findIndex(q=>q.from===c.d&&q.to===pid);if(j>=0){g.proposals.splice(j,1);if(c.k==='acc'&&D)setAlly(g,c.d,pid);}return;}
  }
}
// ── transport: PeerJS data channels, or BroadcastChannel between tabs when testing (?bc=1) ──
function loadPeer(cb,fail){if(BCMODE||window.Peer)return cb();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=cb;s.onerror=()=>fail('net');document.head.appendChild(s);}
function wrap(c){const k={ok:false,send:d=>{try{c.send(d);}catch(e){}}};c.on('open',()=>{k.ok=true;k.onOpen&&k.onOpen();});c.on('data',d=>k.onData&&k.onData(d));c.on('close',()=>{k.ok=false;k.onClose&&k.onClose();});c.on('error',()=>{});return k;}
function hostOpen(code,onConn,ready,fail){
  if(BCMODE){const ch=NET.peer=new BroadcastChannel('sijal-'+code),map={};ch.onmessage=e=>{const m=e.data;if(m.to!=='host')return;let k=map[m.from];
      if(m.hello){k=map[m.from]={ok:true,send:d=>ch.postMessage({to:m.from,d})};onConn(k);}else if(m.bye){if(k){k.ok=false;k.onClose&&k.onClose();}}else if(k&&k.onData)k.onData(m.d);};return ready();}
  try{const p=NET.peer=new Peer('sijal-'+code);p.on('open',ready);p.on('connection',c=>onConn(wrap(c)));p.on('error',e=>fail(e.type==='unavailable-id'?'retry':'net'));}catch(e){fail('net');}
}
function clientOpen(code,onOpen,fail){
  if(BCMODE){const ch=NET.peer=new BroadcastChannel('sijal-'+code),id='c'+Math.random().toString(36).slice(2),k={ok:true,send:d=>ch.postMessage({to:'host',from:id,d})};
    ch.onmessage=e=>{if(e.data.to===id&&k.onData)k.onData(e.data.d);};ch.postMessage({to:'host',from:id,hello:1});k.bye=()=>ch.postMessage({to:'host',from:id,bye:1});return setTimeout(()=>onOpen(k),80);}
  try{const p=NET.peer=new Peer();p.on('open',()=>{const k=wrap(p.connect('sijal-'+code,{reliable:true,serialization:'json'}));k.onOpen=()=>onOpen(k);});
    p.on('error',e=>fail(e.type==='peer-unavailable'?'room':'net'));}catch(e){fail('net');}
}
function netClose(){
  try{if(NET.up&&NET.up.bye)NET.up.bye();if(NET.peer)(NET.peer.destroy||NET.peer.close).call(NET.peer);}catch(e){}
  Object.assign(NET,{on:false,host:false,started:false,conns:[],players:[],q:[],code:'',peer:null,up:null,sums:{},warned:false});
}
function netFail(code){const was=NET.started;netClose();loading(false);if(was)toMenu();else{renderNet();show('net');}err(code);}
// ── lobby ──
const myName=()=>(UI.prof.name||t('defName')).slice(0,18);
function netHost(tries){
  if(!BCMODE&&!window.RTCPeerConnection)return err('net');loading(true);
  loadPeer(()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<5;i++)code+=A[(Math.random()*A.length)|0];if(BCMODE&&window.SIJAL_CODE)code=window.SIJAL_CODE;
    hostOpen(code,k=>{const pl={name:'?',fac:'hawks',conn:k,in:false};
        k.onData=d=>{if(!d)return;
          if(d.t==='hi'){if(NET.started||pl.in||NET.players.length>=16)return k.send({t:'full'});pl.name=String(d.name||'').slice(0,18)||'?';pl.fac=FAC[d.fac]?d.fac:'hawks';pl.in=true;NET.players.push(pl);NET.conns.push(k);lobbyOut();}
          else if(d.t==='c'&&NET.started&&k.pid)NET.q.push([k.pid,d.c]);
          else if(d.t==='sum'&&NET.sums[d.k]!=null&&NET.sums[d.k]!==d.v&&!k.bad){k.bad=true;k.send({t:'desync'});toast(t('mpDesync'),'bad',5000);}};
        k.onClose=()=>{if(!pl.in)return;pl.in=false;if(NET.started){if(k.pid)NET.q.push([k.pid,{k:'drop'}]);}else{NET.players=NET.players.filter(x=>x!==pl);NET.conns=NET.conns.filter(x=>x!==k);lobbyOut();}};},
      ()=>{loading(false);Object.assign(NET,{on:true,host:true,started:false,code,players:[{name:myName(),fac:UI.prof.fac,conn:null,in:true}],conns:[],q:[]});renderLobby();show('net');},
      e=>{if(e==='retry'&&(tries|0)<4){try{NET.peer.destroy();}catch(_){}return netHost((tries|0)+1);}netFail('net');});},netFail);
}
function lobbyOut(){const list=NET.players.map(p=>({name:p.name,fac:p.fac}));NET.players.forEach((p,i)=>{if(p.conn)p.conn.send({t:'lobby',players:list,you:i,code:NET.code});});if(UI.screen==='net')renderLobby();}
function netJoin(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4)return err('room');if(!BCMODE&&!window.RTCPeerConnection)return err('net');loading(true);
  const to=setTimeout(()=>{if(!NET.on)netFail('room');},15000);
  loadPeer(()=>clientOpen(code,k=>{clearTimeout(to);loading(false);Object.assign(NET,{on:true,host:false,started:false,up:k,code,players:[]});
      k.onData=d=>{if(!d)return;
        if(d.t==='lobby'){NET.players=d.players;NET.you=d.you;renderLobby();show('net');}
        else if(d.t==='start')netStart(d.opt,d.me);
        else if(d.t==='f')applyFrame(d);
        else if(d.t==='full')netFail('full');
        else if(d.t==='desync'&&!NET.warned){NET.warned=true;toast(t('mpDesync'),'bad',6000);}};
      k.onClose=()=>{if(NET.on)netFail('host');};
      k.send({t:'hi',name:myName(),fac:UI.prof.fac});},e=>{clearTimeout(to);netFail(e);}),e=>{clearTimeout(to);netFail(e);});
}
function hostStart(){
  if(!NET.host||NET.started)return;const p=UI.prof;if(p.size<0)p.size=UI.mob?0:1;if(!p.botsN)p.botsN=UI.mob?10:14;
  const opt={w:SIZES[p.size][0],h:SIZES[p.size][1],seed:(Math.random()*2**31)|0,type:p.type,bots:clamp(p.botsN|0,6,30),diff:p.diff,mp:true,players:NET.players.map(x=>({name:x.name,fac:x.fac}))};
  NET.players.forEach((x,i)=>{if(x.conn){x.conn.pid=i+1;x.conn.send({t:'start',opt,me:i});}});netStart(opt,0);
}
function netStart(opt,me){
  NET.started=true;NET.q=[];NET.sums={};loading(true);
  setTimeout(()=>{G=newGame(Object.assign({},opt,{me}));prep(G);UI.phase='spawn';UI.paused=false;UI.speed=1;buildHud();show(null);hint(t('mpSpawn'),true);loading(false);
    NET.last=performance.now();NET.acc=0;NET.goAt=NET.last+60000;if(NET.pend){const P=NET.pend;NET.pend=null;P.forEach(applyFrame);}},40);
}
function applyFrame(f){
  const g=G;if(!g||!g.o.mp){(NET.pend||(NET.pend=[])).push(f);return;}
  for(const pc of f.c)applyCmd(pc[0],pc[1]);
  if(f.r&&!g.over){tick(g);if(g.tick%100===0){let v=7;for(const n of g.nations)if(n)v=(v*31+n.tiles*7+Math.floor(n.troops))%1000000007;if(NET.host){NET.sums[g.tick]=v;delete NET.sums[g.tick-1000];}else if(NET.up)NET.up.send({t:'sum',k:g.tick,v});}}
}
function frameOut(r){const f={t:'f',c:NET.q,r};NET.q=[];for(const c of NET.conns)if(c.ok)c.send(f);applyFrame(f);}
function netTick(){
  const g=G;if(!NET.on||!NET.host||!NET.started||!g||!g.o.mp||g.over)return;const now=performance.now(),dt=Math.min(400,now-NET.last);NET.last=now;
  if(!g.started){let all=true;for(const n of g.nations)if(n&&n.human&&!n.spawned)all=false;if((all||now>NET.goAt)&&!NET.q.some(c=>c[1].k==='go'))NET.q.push([g.human,{k:'go'}]);if(NET.q.length)frameOut(0);return;}
  if(UI.paused){if(NET.q.length)frameOut(0);return;}
  NET.acc+=dt*UI.speed;let k=0;while(NET.acc>=100&&k<6){frameOut(1);NET.acc-=100;k++;}if(k===6)NET.acc=0;
}

// under attack: slow heavy drums, a heartbeat, a low growling line and uneasy high strings
function defBeat(){
  const s=AU.step++%16,bar=(AU.step>>4)%8,bass=[73.42,73.42,69.3,73.42,77.78,73.42,69.3,61.74][bar];
  if(s===0||s===3||s===8||s===11){tone(66,.34,'sine',.34,.38);noise(.12,.16,420,60);}
  if(s===6||s===14){tone(52,.5,'sine',.3,.5);noise(.3,.12,900,90);}
  if(s%4===2)noise(.14,.07,7000,2500);
  if(s%4===0)tone(bass,.8,'sawtooth',.06);
  if(s===0){tone(bass/2,3.2,'sine',.11);tone(bass*4,3.3,'sawtooth',.016);tone(bass*4*1.06,3.3,'sawtooth',.016);}
  if(s%2===1&&bar%2===1)tone(bass*8*(s%4===1?1:1.06),.12,'triangle',.022);
  if(s===12)tone([233.08,220,207.65,220][bar%4],.9,'square',.03,.9);
}
// on the offensive: a fast gallop, bright snare and a rising heroic brass call
function atkBeat(){
  const s=AU.step++%16,bar=(AU.step>>4)%8,root=[110,110,130.81,146.83,110,110,164.81,146.83][bar];
  if(s%4===0){tone(84,.2,'sine',.3,.45);noise(.07,.12,600,90);}
  if(s%4===2||s===15){noise(.12,.14,8000,1800);tone(190,.08,'triangle',.06,.7);}
  if(s%4!==1)tone(root,.17,'sawtooth',.055);
  if(s%2===0)noise(.04,.035,9000,5000);
  if(s===0){tone(root*2,1.5,'sawtooth',.035);tone(root*3,1.5,'sawtooth',.026);tone(root/2,1.6,'sine',.08);}
  const mel=[0,-1,7,-1,12,-1,14,12,-1,7,-1,12,15,-1,14,-1][s];if(mel>=0&&bar%2===0)tone(root*2*Math.pow(2,mel/12),.26,'square',.036);
  if(bar%2===1&&(s===0||s===6||s===12))tone(root*4*[1,1.189,1.498][s/6|0],.5,'triangle',.05);
}
function musicTick(){
  if(!AU.ctx||!UI.prof.music||document.hidden||AU.ctx.state!=='running')return;AU.dst=AU.mus;AU.t2=!AU.t2;

}

  sfx('click');saveProf();
}
function handleEvents(){
  const g=G,ev=g.ev;if(!ev.length)return;const me=g.human,demo=g.o.demo,N=g.nations;
  for(const e of ev){
    const A=e.a?N[e.a]:null,D=e.d?N[e.d]:null;
    if(e.t==='boom'){const dm=e.type==='doom',nk=dm||e.type==='nuke';addFx('boom',e.x,e.y,{r:e.r*(nk?1.6:1.25),dur:dm?3200:nk?2000:900,nuke:nk});if(!demo){sfx(nk?'nuke':'boom');if(nk)R.shake=dm?30:16;}continue;}
    if(e.t==='intercept'){addFx('ring',e.x,e.y,{r:3,col:'#9fe0ff'});if(!demo&&e.a===me)feed(t('m_inter'),'good');continue;}
    if(e.t==='meteorWarn'){addFx('ring',e.x,e.y,{r:7,col:'#ff9a5a',dur:1600});if(!demo){feed(t('m_meteor'),'warn');sfx('alert');}continue;}
    if(demo)continue;
    const cn=e.s&&e.s.type==='city'?esc(cityName(e.s.name,UI.lang)):'';
    switch(e.t){
      case'war':if(e.d===me&&A.minor){feed(t('m_warYou',nmh(A)),'bad');}else if(e.d===me){feed(t('m_warYou',nmh(A)),'bad');banner(t('m_warYou',natName(A)),'bad');sfx('siren');(UI.threats||(UI.threats=[])).push({id:e.a,until:performance.now()+14000});}break;
      case'shot':addFx('shot',e.x,e.y,{tx:e.tx,ty:e.ty,dur:420});break;
      case'sunk':addFx('boom',e.x,e.y,{r:2.5,dur:700});if(e.a===me){feed(t('m_sunk'),'good');sfx('boom');}else if(e.d===me){feed(t('m_sunkYou'),'bad');sfx('boom');}break;
      case'cityFall':addFx('ring',e.s.x,e.s.y,{r:7+e.s.level,col:A?A.css:'#fff',dur:1300});
        if(e.a===me){feed(t('m_cityYou',cn),'good');banner(cn);sfx('city');}else if(e.d===me){feed(t('m_cityLost',cn),'bad');if(!e.cap)banner(t('m_cityLost',cn),'bad');sfx('lose1');}break;
      case'cityJoin':if(e.a===me){feed(t('m_join',cn),'good');sfx('city');addFx('ring',e.s.x,e.s.y,{r:5,col:'#ffe9a8'});}break;
      case'capMoved':if(e.d===me){feed(t('m_capYou',cn),'bad');banner(t('m_capYou',cn),'bad');}else feed(t('m_capMoved',nmh(D),cn));break;
      case'collapse':feed(t('m_collapse',nmh(D),nmh(A)),e.a===me?'good':'');if(e.a===me)sfx('win1');break;
      case'allyWarn':if(e.a===me||e.b===me){const P=N[e.a===me?e.b:e.a],no=!P.human&&!P.allyRen[me];const d=no?toast(t('m_allyNo',nmh(P)),'bad',6000):toast(`<span>${t('m_allyWarn',nmh(P))}</span><button class="btn sm ok" data-a="renew:${P.id}:1">${t('renewY')}</button><button class="btn sm" data-a="renew:${P.id}:0">${t('renewN')}</button>`,'prop',0);if(d)d.dataset.ally=P.id;sfx('alert');}break;
      case'allyRenew':if(e.a===me||e.b===me){const P=N[e.a===me?e.b:e.a];feed(t('m_allyRenew',nmh(P)),'good');UI.cardKey='';}break;
      case'allyEnd':if(e.a===me||e.b===me){const P=N[e.a===me?e.b:e.a];for(const d of document.querySelectorAll('.ts[data-ally="'+P.id+'"]'))d.remove();feed(t('m_allyEnd',nmh(P)),'warn');UI.cardKey='';}break;
      case'ally':if(e.a===me||e.b===me){feed(t('m_ally',nmh(N[e.a]),nmh(N[e.b])),'good');sfx('city');sayLine(N[e.a===me?e.b:e.a],'ally');UI.cardKey='';}break;
      case'betray':if(e.a===me||e.b===me){feed(t('m_betray',nmh(N[e.a]),nmh(N[e.b])),'bad');if(e.b===me)sfx('alert');UI.cardKey='';}break;
      case'trade':if(e.a===me){addFx('text',e.x,e.y,{s:'+'+e.amt,dur:1400,col:'#ffe9a8'});sfx('trade');}break;
      case'dead':if(e.d===me&&g.o.mp){banner(t('mpDead'),'bad');feed(t('mpDead'),'bad');sfx('lose');}break;
      case'proposal':{if(e.b!==me)break;const d=toast(`<span>${t('m_prop',nmh(A))}</span><button class="btn sm" data-a="acc:${A.id}">${t('yes')}</button><button class="btn sm" data-a="rej:${A.id}">${t('no')}</button><button class="btn sm" data-a="find:${A.id}">${t('b_focus')}</button>`,'prop',0);if(d)d.dataset.from=A.id;sfx('coin');break;}
      case'reject':if(e.b===me){feed(t('m_rej',nmh(A)));sayLine(A,'reject');}break;
      case'say':if(e.to==null||e.to===me)sayLine(A,e.key);break;
      case'era':if(e.a===me){banner(t('eras')[e.era-1]);feed(t('m_era',t('eras')[e.era-1]),'good');sfx('era');}break;
      case'season':banner(t('seas')[e.s],'sea');if(UI.mob)feed(`<b>${t('seas')[e.s]}</b>: ${t('seaGood')[e.s]}<br><span class="bad">${t('seaBad')[e.s]}</span>`);else{feed(t('seaTip')[e.s]);toast(`<span><b>${t('seas')[e.s]}</b> · ${t('seaGood')[e.s]}<br><span class="bad">${t('seaBad')[e.s]}</span></span>`,'prop',7000);}sfx('season'+e.s);break;
      case'rebel':feed(t('m_rebel',nmh(D)),e.d===me?'bad':'');addFx('ring',e.x,e.y,{r:9,col:'#ff7a4a',dur:1500});break;
      case'plague':feed(t('m_plague',nmh(D)),e.d===me?'bad':'');break;
      case'caravan':feed(t('m_caravan'),'good');sfx('coin');break;
      case'launch':{const nm=t('s_'+e.type);if(e.a===me)sfx('launch');else if(e.d===me){feed(t('m_incoming',nm),'bad');banner(t('m_incoming',nm),'bad');sfx('alert');}else if(e.type!=='rocket')feed(t('m_launch',nmh(A),nm),'warn');break;}
      case'monBuilt':if(e.a===me){banner(t('m_monYou'));feed(t('m_monYou'),'warn');}else{banner(t('m_mon',natName(A)),'bad');feed(t('m_mon',nmh(A)),'bad');sfx('alert');}break;
      case'monLost':feed(t('m_monLost',nmh(A)));break;
      case'coalition':if(e.d===me){banner(t('m_coalYou'),'bad');feed(t('m_coalYou'),'bad');sfx('alert');}else feed(t('m_coal',nmh(D)),'warn');break;
      case'pocket':if(e.a===me){feed(t('m_pocket'),'good');addFx('ring',e.x,e.y,{r:6,col:'#a6f0be'});}break;
      case'landed':if(e.a===me)feed(t('m_landed'),'good');break;
      case'landFail':if(e.a===me)feed(t('m_landFail'),'bad');break;
      case'gift':if(e.a===me){feed(t('m_gift',nmh(N[e.b])),'good');sayLine(N[e.b],'thanks');}break;
      case'cityUp':if(e.a===me&&e.s.level>=3)feed(t('m_cityUp',cn,e.s.level));break;
      case'ult':if(e.a===me)sfx('ult');if(e.x>=0)addFx('ring',e.x,e.y,{r:9,col:A.css});break;
      case'built':if(e.a===me)addFx('ring',e.s.x,e.s.y,{r:4,col:'#ffe9a8',dur:700});break;
      case'over':UI.phase='over';closeCard();setMode(null);setTimeout(showEnd,1500);sfx(e.win?'win':'lose');banner(t(e.win?'win':'lose'),e.win?'':'bad');break;
    }
  }
  ev.length=0;
}

// ── input ──
function tileAt(x,y){const g=G,w=s2w(x,y),tx=Math.floor(w.x),ty=Math.floor(w.y);return tx<0||ty<0||tx>=g.W||ty>=g.H?-1:ty*g.W+tx;}
function hoverAt(x,y){
  const g=G,tip=$('#tip');if(!g||g.o.demo)return;const i=tileAt(x,y);UI.hover=i;if(!tip||UI.mob)return;
  if(i<0||g.M.ter[i]<2||UI.screen){tip.hidden=true;return;}
  const o=g.owner[i],si=g.structAt[i],s=si?g.structs[si-1]:null,n=o?g.nations[o]:null;
  tip.innerHTML=`<b style="color:${n?n.css:'#c9ced4'}">${n?esc(natName(n)):t('neutral')}</b> · ${t('terr')[g.M.ter[i]]}`+(s?`<br>${s.type==='city'?esc(cityName(s.name,UI.lang))+' · '+s.level:t('s_'+s.type)}`:'');
  tip.hidden=false;tip.style.left=Math.min(x+16,view.w-190)+'px';tip.style.top=Math.min(y+18,view.h-60)+'px';
}
function bindInput(){
  const P=new Map(),xy=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};let down=null,drag=false,pd=0,pc=null,lp=0;
  cv.addEventListener('pointerdown',e=>{
    auInit();try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=xy(e);P.set(e.pointerId,p);
    if(P.size===1){down={x:p.x,y:p.y,b:e.button,touch:e.pointerType!=='mouse'};drag=false;clearTimeout(lp);
      if(down.touch)lp=setTimeout(()=>{if(down&&!drag&&G&&!G.o.demo){const i=tileAt(down.x,down.y),o=i>=0?G.owner[i]:0;if(o&&o!==G.human){openCard(o);down=null;}}},520);}
    else if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);pc={x:(a.x+b.x)/2,y:(a.y+b.y)/2};drag=true;clearTimeout(lp);}
  });
  cv.addEventListener('pointermove',e=>{
    const p=P.get(e.pointerId),q=xy(e);if(!G)return;
    if(!p){if(e.pointerType==='mouse')hoverAt(q.x,q.y);return;}
    if(P.size===1){
      if(!drag&&down&&Math.hypot(q.x-down.x,q.y-down.y)>(down.touch?10:5)){drag=true;clearTimeout(lp);}
      if(drag&&!G.o.demo){if(down&&!down.touch&&down.b===0){}else if(false){const A=UI.aim||(UI.aim={pts:[[down.x,down.y]]}),l=A.pts[A.pts.length-1];if(Math.hypot(q.x-l[0],q.y-l[1])>6)A.pts.push([q.x,q.y]);A.x=q.x;A.y=q.y;}else{cam.tx-=(q.x-p.x)/cam.z;cam.ty-=(q.y-p.y)/cam.z;cam.x=cam.tx;cam.y=cam.ty;}}
      p.x=q.x;p.y=q.y;
    }else if(P.size===2){
      p.x=q.x;p.y=q.y;const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      if(pd>0&&!G.o.demo){zoomAt(G,c.x,c.y,d/pd,true);cam.tx-=(c.x-pc.x)/cam.z;cam.ty-=(c.y-pc.y)/cam.z;cam.x=cam.tx;cam.y=cam.ty;}pd=d;pc=c;
    }
    if(e.pointerType==='mouse')hoverAt(q.x,q.y);
  });
  const up=e=>{
    clearTimeout(lp);if(!P.delete(e.pointerId))return;const q=xy(e);
    if(P.size===0){
      if(down&&!drag&&e.type==='pointerup'&&G&&!G.o.demo){const i=tileAt(q.x,q.y);
        if(down.b===2){const o=i>=0?G.owner[i]:0;if(o&&o!==G.human)openCard(o);else setMode(null);}else if(i>=0)onMapTap(i,q.x,q.y);}
      else if(UI.aim&&e.type==='pointerup'&&G&&!G.o.demo){const i=tileAt(q.x,q.y);if(i>=0)onMapTap(i,q.x,q.y);}
      UI.aim=null;down=null;drag=false;
    }else{down=null;drag=true;pd=0;}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',e=>{if(e.pointerType!=='mouse')return;UI.hover=-1;const tp=$('#tip');if(tp)tp.hidden=true;});
  cv.addEventListener('wheel',e=>{e.preventDefault();if(G&&!G.o.demo){const q=xy(e);zoomAt(G,q.x,q.y,Math.exp(-e.deltaY*.0016));}},{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  $('#app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a);});
  $('#app').addEventListener('input',e=>{if(e.target.id==='inName'){UI.prof.name=e.target.value.trim().slice(0,18);saveProf();}else if(e.target.id==='volM'||e.target.id==='volS'){const k=e.target.id;UI.prof[k]=+e.target.value;UI.prof[k==='volM'?'music':'sound']=+e.target.value>0;$('#'+k+'v').textContent=e.target.value;applyVol();if(k==='volS')sfx('coin');saveProf();}else if(e.target.id==='inBots'){UI.prof.botsN=+e.target.value;$('#botsV').textContent=e.target.value;saveProf();}});
  addEventListener('keydown',e=>{
    if(e.target.tagName==='TEXTAREA'||(e.target.tagName==='INPUT'&&e.target.type!=='range'))return;const k=e.key.toLowerCase();UI.keys[k]=true;
    if(!G||G.o.demo)return;
    if(k==='escape'){if(UI.mode)setMode(null);else if(UI.screen==='pause')act('resume');else if(!UI.screen)act('pause');return;}
    if(UI.screen||UI.phase!=='play')return;
    if(k===' '){e.preventDefault();act('sp:0');}else if(k>='1'&&k<='9')barAct(BAR[+k-1]);else if(k==='f')barAct('ult');
    else if(k==='q'||k==='e'){UI.ratio=clamp(Math.round((UI.ratio+(k==='e'?.1:-.1))*20)/20,.05,1);$('#rs').value=UI.ratio*100;hudUpdate();}
    else if(k==='c')act('home');else if(k==='+'||k==='=')zoomAt(G,view.w/2,view.h/2,1.3);else if(k==='-')zoomAt(G,view.w/2,view.h/2,.77);
  });
  addEventListener('keyup',e=>{UI.keys[e.key.toLowerCase()]=false;});
  addEventListener('blur',()=>{UI.keys={};});
}

// ── main loop ──
function frame(ts){
  requestAnimationFrame(frame);const dt=Math.min(100,(ts-lastTs)||16);lastTs=ts;const g=G;if(!g||!R.land)return;
  if(g.o.demo){cam.tx=g.W/2+Math.sin(ts/21000)*g.W*.16;cam.ty=g.H/2+Math.cos(ts/27000)*g.H*.12;cam.tz=fitZoom(g)*1.5;if(g.over||g.tick>7000){startDemo();return;}}
  else if(!UI.screen){const K=UI.keys,s=dt*.55/cam.z;if(K.a||K.arrowleft)cam.tx-=s;if(K.d||K.arrowright)cam.tx+=s;if(K.w||K.arrowup)cam.ty-=s;if(K.s||K.arrowdown)cam.ty+=s;}
  if(g.started&&!g.over&&!g.o.mp&&(g.o.demo||(!UI.paused&&!UI.screen))){acc+=dt*(g.o.demo?2:UI.speed);let n=0;while(acc>=100&&n<10){tick(g);acc-=100;n++;}if(n===10)acc=0;}
  handleEvents();draw(g,dt,ts);
  if(ts-UI.lastHud>250){UI.lastHud=ts;hudUpdate();const m=$('#mini');if(m&&!UI.mob&&!g.o.demo&&!UI.screen)drawMini(g,m);}
  if(UI.screen==='end')repStep(dt);
}
function boot(){
  cv=$('#cv');ctx=cv.getContext('2d');loadProf();applyMode();makeGlyphs();
  {const c=mk(64,64),x=c.getContext('2d');x.translate(32,32);x.rotate(.8);x.drawImage(R.glyph.silo,-32,-32);R.glyph.rocket=c;R.url.rocket=c.toDataURL();}
  {const c=mk(64,64),x=c.getContext('2d');x.drawImage(R.glyph.nuke,8,8,48,48);x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(32,32,29,0,7);x.stroke();R.glyph.doom=c;R.url.doom=c.toDataURL();}
  resize();addEventListener('resize',()=>{applyMode();resize();});
  if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
  bindInput();renderMenu();show('menu');startDemo();requestAnimationFrame(frame);setInterval(musicTick,215);for(const ev of['touchend','pointerup','click','keydown'])document.addEventListener(ev,auInit,{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AU.ctx)auInit();});setInterval(netTick,50);addEventListener('pagehide',()=>{if(NET.on)netClose();});
  if(UI.prof.seen!==LOG[0].v){renderNews(true);show('help');UI.prof.seen=LOG[0].v;saveProf();}
  {const h=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z0-9]{5}$/.test(h)){UI.joinCode=h;renderNet();show('net');}}
  window.__sijal={get G(){return G;},cb:canBuild,NET,UI,R,cam,act,tap:onMapTap,run:n=>{for(let i=0;i<n;i++)tick(G);}};
}
boot();

})();
